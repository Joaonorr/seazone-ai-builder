services:
  postgres:
    image: postgres:17-alpine
    container_name: seazone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seazone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seazone_dev}
      POSTGRES_DB: ${POSTGRES_DB:-seazone_ai_builder}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - seazone_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: seazone-ai-builder:dev
    build:
      context: .

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-seazone}:${POSTGRES_PASSWORD:-seazone_dev}@postgres:5432/${POSTGRES_DB:-seazone_ai_builder}?schema=public"

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run db:migrate:deploy

  bootstrap:
    image: seazone-ai-builder:dev
    build:
      context: .

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-seazone}:${POSTGRES_PASSWORD:-seazone_dev}@postgres:5432/${POSTGRES_DB:-seazone_ai_builder}?schema=public"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: npm run db:seed

  app:
    image: seazone-ai-builder:dev
    build:
      context: .

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-seazone}:${POSTGRES_PASSWORD:-seazone_dev}@postgres:5432/${POSTGRES_DB:-seazone_ai_builder}?schema=public"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}

    depends_on:
      bootstrap:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  seazone_postgres_data:
  app_node_modules:
  app_next:
