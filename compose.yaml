services:
  postgres:
    image: postgres:17-alpine
    container_name: seazone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: seazone
      POSTGRES_PASSWORD: seazone_dev
      POSTGRES_DB: seazone_ai_builder

    ports:
      - "5432:5432"

    volumes:
      - seazone_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U seazone -d seazone_ai_builder",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seazone_postgres_data: